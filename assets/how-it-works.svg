<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="How Talk works: hold fn, speak while Talk transcribes on your Mac, let go, and the text is typed in about a tenth of a second">
  <defs>
    <clipPath id="card"><rect width="1200" height="300" rx="24"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#5E5B57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g clip-path="url(#card)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect width="1200" height="300" fill="#0C0C0E"/>

    <g fill="#17171A" stroke="#FFFFFF" stroke-opacity="0.06">
      <rect x="48" y="32" width="246" height="236" rx="16"/>
      <rect x="334" y="32" width="246" height="236" rx="16"/>
      <rect x="620" y="32" width="246" height="236" rx="16"/>
      <rect x="906" y="32" width="246" height="236" rx="16"/>
    </g>
    <g stroke="#5E5B57" stroke-width="1.6">
      <line x1="300" y1="95" x2="328" y2="95" marker-end="url(#arrow)"/>
      <line x1="586" y1="95" x2="614" y2="95" marker-end="url(#arrow)"/>
      <line x1="872" y1="95" x2="900" y2="95" marker-end="url(#arrow)"/>
    </g>

    <!-- icons, all 56 px, top at y=67 -->
    <g transform="translate(76 67)">
      <rect width="56" height="56" rx="12" fill="#1B1714" stroke="#D9A566" stroke-opacity="0.75" stroke-width="1.5"/>
      <circle cx="28" cy="21" r="7.5" fill="none" stroke="#D9A566" stroke-width="1.5"/>
      <path d="M20.5 21h15M28 13.5c-3 3-3 12 0 15M28 13.5c3 3 3 12 0 15" fill="none" stroke="#D9A566" stroke-width="1.2"/>
      <text x="28" y="45" text-anchor="middle" font-size="12" font-weight="600" fill="#D9A566">fn</text>
    </g>
    <g transform="translate(362 71)" fill="#FF6B4A">
      <rect x="0" y="16" width="5" height="16" rx="2.5"/>
      <rect x="10" y="8" width="5" height="32" rx="2.5"/>
      <rect x="20" y="0" width="5" height="48" rx="2.5"/>
      <rect x="30" y="10" width="5" height="28" rx="2.5"/>
      <rect x="40" y="4" width="5" height="40" rx="2.5"/>
      <rect x="50" y="14" width="5" height="20" rx="2.5"/>
    </g>
    <g transform="translate(648 67)">
      <rect width="56" height="56" rx="12" fill="#17171A" stroke="#8E93F5" stroke-opacity="0.55" stroke-width="1.5"/>
      <circle cx="17" cy="28" r="4" fill="#8E93F5"/>
      <circle cx="28" cy="28" r="4" fill="#8E93F5" opacity="0.7"/>
      <circle cx="39" cy="28" r="4" fill="#8E93F5" opacity="0.45"/>
    </g>
    <g transform="translate(934 67)">
      <rect width="56" height="56" rx="28" fill="#7BC8A4" fill-opacity="0.14" stroke="#7BC8A4" stroke-opacity="0.5" stroke-width="1.5"/>
      <path d="M17 29l7 7 15-15" fill="none" stroke="#7BC8A4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g font-size="13" font-weight="600" fill="#5E5B57" letter-spacing="1.2">
      <text x="76" y="164">STEP 1</text>
      <text x="362" y="164">STEP 2</text>
      <text x="648" y="164">STEP 3</text>
      <text x="934" y="164">STEP 4</text>
    </g>
    <g font-size="20" font-weight="600" fill="#EAE8E4">
      <text x="76" y="192">Hold fn</text>
      <text x="362" y="192">Speak</text>
      <text x="648" y="192">Let go</text>
      <text x="934" y="192">It's typed</text>
    </g>
    <g font-size="15" fill="#94918B">
      <text x="76" y="220">Talk starts listening.</text>
      <text x="76" y="242">Nothing leaves your Mac.</text>
      <text x="362" y="220">It transcribes as you</text>
      <text x="362" y="242">talk, every 0.4 s.</text>
      <text x="648" y="220">Only your last few</text>
      <text x="648" y="242">words are left to check.</text>
      <text x="934" y="220">Text appears at your</text>
      <text x="934" y="242">cursor in about 0.1 s.</text>
    </g>
  </g>
</svg>
