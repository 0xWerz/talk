<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="About 0.1 seconds from letting go to text. 2.6 percent word error rate. 1.3 gigabytes of memory while running. Free, with no account.">
  <defs><clipPath id="card"><rect width="1200" height="190" rx="24"/></clipPath></defs>
  <g clip-path="url(#card)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect width="1200" height="190" fill="#0C0C0E"/>
    <g fill="#17171A" stroke="#FFFFFF" stroke-opacity="0.06">
      <rect x="48" y="32" width="264" height="126" rx="16"/>
      <rect x="328" y="32" width="264" height="126" rx="16"/>
      <rect x="608" y="32" width="264" height="126" rx="16"/>
      <rect x="888" y="32" width="264" height="126" rx="16"/>
    </g>
    <g font-size="13" font-weight="600" fill="#5E5B57" letter-spacing="1.2">
      <text x="76" y="66">SPEED</text>
      <text x="356" y="66">ACCURACY</text>
      <text x="636" y="66">MEMORY</text>
      <text x="916" y="66">PRICE</text>
    </g>
    <g font-size="40" font-weight="600" fill="#EAE8E4" letter-spacing="-1">
      <text x="74" y="112">0.1 s</text>
      <text x="354" y="112">2.6%</text>
      <text x="634" y="112">1.3 GB</text>
      <text x="914" y="112">$0</text>
    </g>
    <g font-size="15" fill="#94918B">
      <text x="76" y="138">from letting go to text</text>
      <text x="356" y="138">word error rate</text>
      <text x="636" y="138">while running</text>
      <text x="916" y="138">no account, no subscription</text>
    </g>
  </g>
</svg>
