[project]
name = "talk-sidecar"
version = "0.1.0"
description = "Local speech-to-text sidecar for Talk"
requires-python = ">=3.11,<3.14"
dependencies = [
    "parakeet-mlx>=0.3.5",
    "numpy>=2.0",
]

[project.scripts]
talk-sidecar = "talk_sidecar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
